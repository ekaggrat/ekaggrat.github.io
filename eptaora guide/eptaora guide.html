    <script>
        const images = ["images/eptaora assemble2_Page_01.jpg", "images/eptaora assemble2_Page_02.jpg", "images/eptaora assemble2_Page_03.jpg", "images/eptaora assemble2_Page_04.jpg", "images/eptaora assemble2_Page_05.jpg", "images/eptaora assemble2_Page_06.jpg", "images/eptaora assemble2_Page_07.jpg", "images/eptaora assemble2_Page_08.jpg", "images/eptaora assemble2_Page_09.jpg", "images/eptaora assemble2_Page_10.jpg", "images/eptaora assemble2_Page_11.jpg", "images/eptaora assemble2_Page_12.jpg", "images/eptaora assemble2_Page_13.jpg", "images/eptaora assemble2_Page_14.jpg", "images/eptaora assemble2_Page_15.jpg", "images/eptaora assemble2_Page_16.jpg", "images/eptaora assemble2_Page_17.jpg", "images/eptaora assemble2_Page_18.jpg", "images/eptaora assemble2_Page_19.jpg", "images/eptaora assemble2_Page_20.jpg", "images/eptaora assemble2_Page_21.jpg", "images/eptaora assemble2_Page_22.jpg", "images/eptaora assemble2_Page_23.jpg", "images/eptaora assemble2_Page_24.jpg", "images/eptaora assemble2_Page_25.jpg", "images/eptaora assemble2_Page_26.jpg", "images/eptaora assemble2_Page_27.jpg", "images/eptaora assemble2_Page_28.jpg", "images/eptaora assemble2_Page_29.jpg", "images/eptaora assemble2_Page_30.jpg", "images/eptaora assemble2_Page_31.jpg", "images/eptaora assemble2_Page_32.jpg", "images/eptaora assemble2_Page_33.jpg"];
        let currentIndex = 0;

        // ... Keep existing modal javascript functions unchanged ...
        function openModal(index) {
            currentIndex = index;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = images[currentIndex];
            lightbox.classList.remove('hidden');
            requestAnimationFrame(() => { 
                lightbox.classList.remove('opacity-0'); 
            });
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => { lightbox.classList.add('hidden'); }, 300);
            document.body.style.overflow = ''; 
        }

        function nextImage(event) {
            if (event) event.stopPropagation();
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('lightbox-img').src = images[currentIndex];
        }

        function prevImage(event) {
            if (event) event.stopPropagation();
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('lightbox-img').src = images[currentIndex];
        }

        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('hidden')) {
                if (event.key === "Escape") closeModal();
                if (event.key === "ArrowRight") nextImage(null);
                if (event.key === "ArrowLeft") prevImage(null);
            }
        });
    </script>
